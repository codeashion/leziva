<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="symGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#226192" />
      <stop offset="100%" stop-color="#164366" />
    </linearGradient>
  </defs>

  <!-- Background circular badge in warm ivory -->
  <circle cx="50" cy="50" r="48" fill="#EAE6DE" stroke="#226192" stroke-width="1.5" />

  <!-- Outer Heritage Loom Diamond -->
  <rect x="25" y="25" width="50" height="50" rx="8" transform="rotate(45 50 50)" fill="none" stroke="#226192" stroke-width="2.5" />
  <rect x="30" y="30" width="40" height="40" rx="6" transform="rotate(45 50 50)" fill="#FFFFFF" fill-opacity="0.8" stroke="#EF8557" stroke-width="1.5" />
  
  <!-- Stylized 'L' Letterform Monogram -->
  <path d="M 40 32 L 40 68 L 62 68" fill="none" stroke="#226192" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Delicate Coral Spark / Thread Accent -->
  <circle cx="62" cy="56" r="3.2" fill="#EF8557" />
  <path d="M 46 44 L 56 44" stroke="#EF8557" stroke-width="1.8" stroke-linecap="round" />
